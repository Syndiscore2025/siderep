name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build web app
        run: npm run build:web

      - name: Verify build boundaries
        run: |
          test -f dist/manifest.json
          test -f dist-web/index.html
          grep -Fq 'Content-Security-Policy' dist-web/index.html
          grep -Fq "script-src 'self' 'nonce-siderep-web-csp'" dist-web/index.html
          ! grep -Fq "'unsafe-inline'" dist-web/index.html
          ! find dist-web -type f \( -name '*service-worker*' -o -name '*content-script*' \) | grep -q .
          ! grep -R -F '@supabase/supabase-js' dist --include='*.js'
          ! grep -R -F 'supabase.co' dist-web --include='*.js' --include='*.html'

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: siderep-dist
          path: dist/
          retention-days: 14

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: siderep-dist-web
          path: dist-web/
          retention-days: 14
